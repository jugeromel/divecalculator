name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:   # permite rodar manualmente pelo GitHub

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configura Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instala dependências do sistema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            build-essential git zip unzip \
            openjdk-17-jdk \
            libffi-dev libssl-dev libncurses5-dev \
            libsqlite3-dev python3-dev autoconf \
            automake libtool libltdl-dev libz-dev \
            libgdk-pixbuf2.0-dev

      - name: Instala Buildozer e Cython
        run: pip install buildozer==1.5.0 cython==0.29.37

      - name: Cache do SDK/NDK do Android
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ hashFiles('decompression_calc/buildozer.spec') }}
          restore-keys: buildozer-

      - name: Compila APK (debug)
        run: |
          unset ANDROID_HOME
          unset ANDROID_SDK_ROOT
          buildozer android debug

      - name: Faz upload do APK
        uses: actions/upload-artifact@v4
        with:
          name: divecalc-debug
          path: decompression_calc/bin/*.apk
          retention-days: 30
